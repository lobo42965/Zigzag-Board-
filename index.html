<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICT Domains: 3D Zigzag Board</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9eef3;--grid:#b7dde6;--ink:#0b3b57;--paper:#fffdf6;--tape:rgba(31,167,201,.6);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a2230;--grid:#12384b;--ink:#e3f6fb;--paper:#f6f1e3}}
:root[data-theme="dark"]{--bg:#0a2230;--grid:#12384b;--ink:#e3f6fb;--paper:#f6f1e3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.4 "Atkinson Hyperlegible",system-ui,sans-serif;background-color:var(--bg);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
header{max-width:820px;margin:auto;padding:16px 16px 0;text-align:center}
h1{font:800 clamp(24px,5vw,38px)/1.05 "Bricolage Grotesque",Georgia,serif;margin:0}
header p{margin:6px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:10px 12px}
.bar button,.bar label{font:inherit;font-weight:700;padding:8px 13px;border:2px solid var(--ink);border-radius:10px;background:transparent;color:var(--ink);cursor:pointer}
.bar label{display:flex;gap:8px;align-items:center;cursor:default}
button:focus-visible,input:focus-visible,.face:focus-visible{outline:3px solid #e08a1e;outline-offset:2px}
#hold{position:relative;overflow:hidden;touch-action:none;cursor:grab;user-select:none}
#fit{position:relative;transform-origin:top left;perspective:2200px}
#floor{position:absolute;left:5%;right:5%;bottom:-6px;height:70px;background:radial-gradient(ellipse at center,rgba(0,0,0,.4),transparent 68%);filter:blur(7px)}
#spin{position:absolute;top:30px;left:40px;height:430px;transform-style:preserve-3d}
.p{position:relative;width:190px;height:430px;transform-style:preserve-3d;transform-origin:left center}
.p>.p{position:absolute;left:100%;top:0}
.p>.p::before{content:"";position:absolute;left:-8px;top:0;bottom:0;width:16px;background:var(--tape);z-index:3;transform:translateZ(1px)}
.face{position:absolute;inset:0;background:var(--paper);color:#0b3b57;border:3px solid var(--c);overflow:hidden;cursor:zoom-in;font-size:12px;line-height:1.3;
background-image:linear-gradient(#cfeaf0 1px,transparent 1px),linear-gradient(90deg,#cfeaf0 1px,transparent 1px);background-size:18px 18px;transition:transform .35s,box-shadow .35s}
.face:hover{transform:translateZ(26px);box-shadow:0 14px 24px rgba(0,0,0,.3)}
.hd{background:var(--c);color:#fff;padding:8px 10px;display:flex;gap:8px;align-items:center;font:800 14px/1.1 "Bricolage Grotesque",Georgia,serif}
.hd i{font-style:normal;font-size:34px;line-height:1}
.face ol{margin:0;padding:10px 12px 10px 28px}.face li{margin:0 0 7px}
.face li::marker{color:var(--c);font-weight:700}
#ov{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(5,25,38,.7);padding:12px}
#ov.show{display:flex}
#sheet{width:100%;max-width:520px;max-height:calc(100vh - 24px);overflow:auto;background:var(--paper);color:#0b3b57;border:4px solid var(--c);border-radius:6px}
#sheet .face{position:static;cursor:default;font-size:16px;border:0;overflow:visible;background:none}
#sheet .face:hover{transform:none;box-shadow:none}
#sheet .hd{font-size:21px}#sheet .hd i{font-size:44px}
#sheet ol{padding:14px 16px 14px 36px}
#nav{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-top:3px solid var(--c);position:sticky;bottom:0;background:var(--paper)}
#nav button{font:inherit;font-weight:700;padding:8px 14px;border:2px solid #0b3b57;border-radius:10px;background:transparent;color:#0b3b57;cursor:pointer}
</style></head>
<body>
<header><h1>ICT Domains Zigzag Board</h1>
<p>Seven hinged panels, one per domain. Drag to turn the board, pinch or scroll to zoom, and tap a number to zoom into that panel.</p></header>
<div class="bar"><button id="zo" aria-label="Zoom out">−</button><button id="zi" aria-label="Zoom in">+</button><button id="rs">Reset view</button><button id="stand">Stand it up</button><button id="flat">Lay it flat</button>
<label>Fold <input id="fold" type="range" min="0" max="70" value="32" aria-label="Fold angle"></label></div>
<div id="hold"><div id="fit"><div id="floor"></div><div id="spin"></div></div></div>
<div class="bar" id="chips" role="group" aria-label="Open a domain"></div>
<div id="ov"><div id="sheet" role="dialog" aria-modal="true"><div id="body"></div>
<div id="nav"><button id="prev">Previous</button><button id="close">Close</button><button id="next">Next</button></div></div></div>
<script>
var D=[
["Understanding ICT in Education","#1388a8",["Demonstrate awareness of policies affecting ICT in education","Comply with ICT policies as they affect teaching-learning","Contextualize ICT policies to the learning environment"]],
["Curriculum and Assessment","#c4700d",["Demonstrate understanding of concepts, principles and theories of ICT systems as they apply to teaching-learning","Evaluate digital and non-digital learning resources in response to student’s diverse needs","Develop digital learning resources to enhance teaching-learning","Use ICT tools to develop 21st century skills: information media and technology skills, learning and innovation skills, career skills and effective communication skills"]],
["Pedagogy","#6347e0",["Apply relevant technology tools for classroom activities","Use ICT knowledge to solve complex problems and support student collaborative activities","Model collaborative knowledge construction in face to face and virtual environments"]],
["Technology Tools","#1f8a5a",["Demonstrate competence in the technical operations of technology tools and systems as they apply to teaching and learning","Use technology tools to create new learning opportunities to support community of learners","Demonstrate proficiency in the use of technology tools to support teaching and learning"]],
["Organization and Administration","#c93a52",["Manage technology-assisted instruction in an inclusive classroom environment","Exhibit leadership in shared decision-making using technology tools"]],
["Teacher Professional Learning","#8f6a00",["Explore existing and emerging technology to acquire additional content and pedagogical knowledge","Utilize technology tools in creating communities of practice","Collaborate with peers, colleagues and stakeholders to access information in support of professional learning"]],
["Teacher Disposition","#2f5fc4",["Demonstrate social, ethical, and legal responsibility in the use of technology tools and resources","Show positive attitude towards the use of technology tools"]]];
function face(i,tab){var d=D[i];return '<div class="face" style="--c:'+d[1]+'"'+(tab?' tabindex="0" role="button" aria-label="Read domain '+(i+1)+'"':'')+'><div class="hd"><i>'+(i+1)+'</i><span>'+d[0]+'</span></div><ol>'+d[2].map(function(t){return '<li>'+t+'</li>'}).join('')+'</ol></div>'}
var html='';for(var k=6;k>=0;k--)html='<div class="p">'+face(k,1)+html+'</div>';
var spin=document.getElementById('spin'),fit=document.getElementById('fit'),hold=document.getElementById('hold');
spin.innerHTML=html;
var ps=spin.querySelectorAll('.p'),cur=0,ry=0,fa=32,moved=0;
function pose(){
 var r=fa*Math.PI/180,tot=7*190*Math.cos(r),net=[],W=tot+80;
 ps.forEach(function(p,i){net[i]=i%2?-fa:fa;p.style.transform='rotateY('+(i?net[i]-net[i-1]:net[0])+'deg)';p.firstChild.style.filter='brightness('+(i%2?1-fa/300:1)+')'});
 var FW=7*190+80;
 spin.style.width=tot+'px';spin.style.left=((FW-tot)/2)+'px';spin.style.transformOrigin=(tot/2)+'px 50% '+(-95*Math.sin(r))+'px';spin.style.transform='rotateY('+ry+'deg)';
 fit.style.width=FW+'px';fit.style.height='520px';fit.dataset.w=FW;scale();
}
var FWd=7*190+80,Z=1,FX=FWd/2,FY=260,FOC=-1,tw;
function base(){return Math.min(1,(innerWidth-8)/FWd)}
function scale(){
 var s0=base(),S=s0*Z,hw=hold.clientWidth||innerWidth,hh=Math.max(520*s0,innerHeight*.58);
 hold.style.height=hh+'px';
 fit.style.transform='translate('+(hw/2-S*FX)+'px,'+(hh/2-S*FY)+'px) scale('+S+')';
}
function view(z,fx,fy,fo){clearInterval(tw);FOC=fo;var n=0;
 Array.prototype.forEach.call(ch.children,function(b,k){b.style.background=k==fo?D[k][1]:'transparent';b.style.color=k==fo?'#fff':'inherit'});
 tw=setInterval(function(){Z+=(z-Z)*.18;FX+=(fx-FX)*.18;FY+=(fy-FY)*.18;
  if(++n>60||(Math.abs(z-Z)<.005&&Math.abs(fx-FX)<.5&&Math.abs(fy-FY)<.5)){Z=z;FX=fx;FY=fy;clearInterval(tw)}scale()},16)}
function reset(){ry=0;pose();view(1,FWd/2,260,-1)}
function focus(i){
 clearInterval(tw);ry=0;pose();
 var S=base()*Z,fr=fit.getBoundingClientRect(),r=ps[i].firstChild.getBoundingClientRect();
 var fx=(r.left+r.width/2-fr.left)/S,fy=(r.top+r.height/2-fr.top)/S;
 var pw=190*Math.cos(fa*Math.PI/180),z=Math.min(hold.clientWidth*.9/pw,hold.clientHeight*.92/430)/base();
 view(Math.max(.5,Math.min(5,z)),fx,fy,i);
}
function tap(i){if(FOC==i&&Z>1.5)open(i);else focus(i)}
var fold=document.getElementById('fold');
var tm;function go(t){clearInterval(tm);ry=0;tm=setInterval(function(){fa+=(t-fa)*.2;if(Math.abs(t-fa)<.3){fa=t;clearInterval(tm)}fold.value=fa;pose()},16)}
fold.oninput=function(){clearInterval(tm);fa=+fold.value;pose()};
document.getElementById('stand').onclick=function(){go(32)};
document.getElementById('flat').onclick=function(){go(0)};
var P={},lx=0,ly=0,pd=1,pz=1;
function dist(){var k=Object.keys(P);return Math.hypot(P[k[0]].x-P[k[1]].x,P[k[0]].y-P[k[1]].y)||1}
hold.addEventListener('pointerdown',function(e){P[e.pointerId]={x:e.clientX,y:e.clientY};lx=e.clientX;ly=e.clientY;moved=0;clearInterval(tw);if(Object.keys(P).length==2){pd=dist();pz=Z}});
addEventListener('pointermove',function(e){
 if(!P[e.pointerId])return;P[e.pointerId]={x:e.clientX,y:e.clientY};
 if(Object.keys(P).length==2){moved=99;Z=Math.max(.5,Math.min(5,pz*dist()/pd));scale();return}
 var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
 if(Z>1.05){var S=base()*Z;FX-=dx/S;FY-=dy/S;scale()}else{ry=Math.max(-60,Math.min(60,ry+dx*.3));pose()}});
function up(e){delete P[e.pointerId];var k=Object.keys(P);if(k.length==1){lx=P[k[0]].x;ly=P[k[0]].y}}
addEventListener('pointerup',up);addEventListener('pointercancel',up);
hold.addEventListener('wheel',function(e){e.preventDefault();clearInterval(tw);Z=Math.max(.5,Math.min(5,Z*Math.exp(-e.deltaY*.0015)));scale()},{passive:false});
document.getElementById('zi').onclick=function(){view(Math.min(5,Z*1.4),FX,FY,FOC)};
document.getElementById('zo').onclick=function(){view(Math.max(.5,Z/1.4),FX,FY,FOC)};
document.getElementById('rs').onclick=reset;
addEventListener('resize',scale);
var ov=document.getElementById('ov'),bd=document.getElementById('body'),sh=document.getElementById('sheet'),ch=document.getElementById('chips');
function open(k){cur=(k+7)%7;bd.innerHTML=face(cur,0);sh.style.setProperty('--c',D[cur][1]);ov.classList.add('show');document.getElementById('close').focus()}
ps.forEach(function(p,i){var f=p.firstChild;f.onclick=function(){if(moved<6)tap(i)};f.onkeydown=function(e){if(e.key=='Enter'||e.key==' '){e.preventDefault();tap(i)}}});
D.forEach(function(d,i){var b=document.createElement('button');b.textContent=i+1;b.title=d[0];b.setAttribute('aria-label','Domain '+(i+1)+': '+d[0]);b.style.borderColor=d[1];b.onclick=function(){focus(i)};ch.appendChild(b)});
document.getElementById('prev').onclick=function(){open(cur-1)};
document.getElementById('next').onclick=function(){open(cur+1)};
document.getElementById('close').onclick=function(){ov.classList.remove('show')};
addEventListener('keydown',function(e){if(e.key=='Escape')ov.classList.remove('show')});
pose();
</script></body></html>
